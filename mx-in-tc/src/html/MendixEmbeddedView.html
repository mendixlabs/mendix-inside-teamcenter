<div class="aw-layout-flexColumn">
    <div ref="data.containerRef" class="aw-layout-flexColumn"></div>

    <popup-blocked-error-panel exist-when="conditions.isPopupBlocked" retry="actions.loadMendix">
    </popup-blocked-error-panel>

    <general-error-panel exist-when="conditions.hasGeneralError" error-message="{{data.error.message}}"
        reload="actions.reload">
    </general-error-panel>
</div>
